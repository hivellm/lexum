# Default values for lexum
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Image configuration
image:
  repository: lexum
  tag: "0.1.0-alpha"
  pullPolicy: IfNotPresent

# Replica configuration
replicaCount: 3

# Service configuration
service:
  type: ClusterIP
  port: 9200
  annotations: {}
  # sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800

# Headless service for StatefulSet
headlessService:
  enabled: true
  port: 9200

# LoadBalancer service (optional)
loadBalancer:
  enabled: false
  annotations: {}
  # For AWS: service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  # For GCP: cloud.google.com/load-balancer-type: "Internal"

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: lexum.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: lexum-tls
  #    hosts:
  #      - lexum.example.com

# Cluster configuration
cluster:
  name: "lexum-cluster"
  initialMasterNodes: []

# Node configuration
node:
  name: ""  # Auto-generated from pod name if empty
  roles:
    - "master"
    - "data"
    - "ingest"

# Network configuration
network:
  host: "0.0.0.0"
  httpPort: 9200
  transportPort: 17300

# Storage paths
path:
  data: "/data"
  logs: "/var/log/lexum"

# Logging configuration
logging:
  level: "info"  # trace, debug, info, warn, error
  format: "json"  # json, pretty
  outputs:
    - "stdout"

# Snapshot configuration
snapshots:
  path: "/snapshots"
  maxSnapshots: 100
  compressionEnabled: true

# Resource limits
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

# Persistent volumes
persistence:
  enabled: true
  storageClass: ""  # Use default storage class if empty
  data:
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  snapshots:
    size: 20Gi
    accessModes:
      - ReadWriteOnce

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Health probes
livenessProbe:
  httpGet:
    path: /_cluster/health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /_cluster/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /_cluster/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 30

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max

# ServiceMonitor for Prometheus
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  # prometheus.io/scrape: "true"
  # prometheus.io/port: "9200"
  # prometheus.io/path: "/metrics"

# Namespace configuration
namespace:
  create: false
  name: ""

# Service account
serviceAccount:
  create: false
  name: ""

# Additional environment variables
env: []
  # - name: CUSTOM_VAR
  #   value: "custom-value"

# Additional secrets (mounted as environment variables)
secrets: []
  # - name: api-key
  #   secretName: lexum-secret
  #   secretKey: api-key

# Init containers
initContainers: []
  # - name: init-something
  #   image: busybox:latest
  #   command: ['sh', '-c', 'echo init']

# Termination grace period
terminationGracePeriodSeconds: 60

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Additional labels
extraLabels: {}

# Additional annotations
extraAnnotations: {}

