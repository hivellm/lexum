{{- if lt .Values.replicaCount 1 }}
{{- fail "replicaCount must be at least 1" }}
{{- end }}

{{- if gt .Values.replicaCount 100 }}
{{- fail "replicaCount cannot exceed 100" }}
{{- end }}

{{- if and .Values.persistence.enabled (lt (int (regexReplaceAll "Gi" .Values.persistence.data.size "")) 1) }}
{{- fail "persistence.data.size must be at least 1Gi" }}
{{- end }}

{{- if and .Values.autoscaling.enabled (gt .Values.autoscaling.minReplicas .Values.autoscaling.maxReplicas) }}
{{- fail "autoscaling.minReplicas cannot be greater than autoscaling.maxReplicas" }}
{{- end }}

{{- if and .Values.autoscaling.enabled (lt .Values.autoscaling.minReplicas 1) }}
{{- fail "autoscaling.minReplicas must be at least 1" }}
{{- end }}

{{- if not (has .Values.logging.level (list "trace" "debug" "info" "warn" "error")) }}
{{- fail (printf "logging.level must be one of: trace, debug, info, warn, error. Got: %s" .Values.logging.level) }}
{{- end }}

{{- if not (has .Values.logging.format (list "json" "pretty")) }}
{{- fail (printf "logging.format must be one of: json, pretty. Got: %s" .Values.logging.format) }}
{{- end }}

