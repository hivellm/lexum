apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lexum.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lexum.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "lexum.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lexum.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lexum.selectorLabels" . | nindent 8 }}
      {{- with .Values.extraAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      
      {{- if .Values.initContainers }}
      initContainers:
      {{- range .Values.initContainers }}
      - name: {{ .name }}
        image: {{ .image }}
        {{- if .command }}
        command: {{ .command }}
        {{- end }}
        {{- if .args }}
        args: {{ .args }}
        {{- end }}
        {{- if .volumeMounts }}
        volumeMounts:
        {{- toYaml .volumeMounts | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- else }}
      # Init container to set permissions
      initContainers:
      - name: init-permissions
        image: busybox:latest
        command: ['sh', '-c']
        args:
          - |
            chown -R 1000:1000 /data /snapshots
            chmod -R 755 /data /snapshots
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
        - name: snapshots
          mountPath: /snapshots
      {{- end }}
      
      containers:
      - name: lexum-server
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        
        env:
        - name: LEXUM_DATA_DIR
          value: {{ .Values.path.data | quote }}
        - name: LEXUM_NETWORK_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "lexum.fullname" . }}-config
              key: network.host
        - name: LEXUM_NETWORK_HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "lexum.fullname" . }}-config
              key: network.http_port
        - name: LEXUM_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "lexum.fullname" . }}-config
              key: cluster.name
        - name: LEXUM_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: RUST_LOG
          value: {{ .Values.logging.level | quote }}
        {{- range .Values.env }}
        - name: {{ .name }}
          {{- if .value }}
          value: {{ .value | quote }}
          {{- else if .valueFrom }}
          valueFrom:
            {{- toYaml .valueFrom | nindent 12 }}
          {{- end }}
        {{- end }}
        
        ports:
        - name: http
          containerPort: {{ .Values.network.httpPort }}
          protocol: TCP
        - name: transport
          containerPort: {{ .Values.network.transportPort }}
          protocol: TCP
        
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        
        volumeMounts:
        - name: data
          mountPath: {{ .Values.path.data | quote }}
        - name: snapshots
          mountPath: {{ .Values.snapshots.path | quote }}
        
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 10 }}
        
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      
      restartPolicy: Always
      
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
        {{- toYaml .Values.persistence.data.accessModes | nindent 8 }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.data.size }}
  - metadata:
      name: snapshots
    spec:
      accessModes:
        {{- toYaml .Values.persistence.snapshots.accessModes | nindent 8 }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.snapshots.size }}
  {{- end }}

