apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lexum.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lexum.labels" . | nindent 4 }}
data:
  cluster.name: {{ .Values.cluster.name | quote }}
  network.host: {{ .Values.network.host | quote }}
  network.http_port: {{ .Values.network.httpPort | quote }}
  path.data: {{ .Values.path.data | quote }}
  path.logs: {{ .Values.path.logs | quote }}
  logging.level: {{ .Values.logging.level | quote }}
  logging.format: {{ .Values.logging.format | quote }}
  snapshots.path: {{ .Values.snapshots.path | quote }}
  snapshots.max_snapshots: {{ .Values.snapshots.maxSnapshots | quote }}
  snapshots.compression_enabled: {{ .Values.snapshots.compressionEnabled | quote }}

