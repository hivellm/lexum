# Kustomization file for easy deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lexum

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - service-headless.yaml
  - service.yaml
  - statefulset.yaml
  - ingress.yaml
  - hpa.yaml
  - servicemonitor.yaml

# Common labels
commonLabels:
  app: lexum-search-engine
  managed-by: kustomize

# Images (override with: kustomize edit set image lexum-server=your-registry/lexum:tag)
images:
  - name: lexum-server
    newName: lexum
    newTag: 0.1.0-alpha

# Replicas (override with: kustomize edit set replicas statefulset/lexum 5)
replicas:
  - name: lexum
    count: 3

