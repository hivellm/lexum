apiVersion: v1
kind: Secret
metadata:
  name: lexum-secret
  namespace: lexum
  labels:
    app: lexum-search-engine
type: Opaque
# Example secret data (base64 encoded)
# To create: kubectl create secret generic lexum-secret --from-literal=api-key=your-api-key --namespace=lexum
# Or use: echo -n 'your-api-key' | base64
stringData:
  # API key for authentication (optional)
  # api-key: "your-api-key-here"
  
  # AWS credentials for S3 snapshots (optional)
  # aws-access-key-id: ""
  # aws-secret-access-key: ""
  
  # Azure storage account key (optional)
  # azure-storage-account-key: ""

