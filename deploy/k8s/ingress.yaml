apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lexum-ingress
  namespace: lexum
  labels:
    app: lexum-search-engine
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    
    # For TLS termination
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # For AWS ALB
    # alb.ingress.kubernetes.io/scheme: "internet-facing"
    # alb.ingress.kubernetes.io/target-type: "ip"
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    
    # For GCP
    # kubernetes.io/ingress.class: "gce"
    # kubernetes.io/ingress.global-static-ip-name: "lexum-ip"
spec:
  ingressClassName: nginx  # Change to your ingress class
  # TLS configuration (uncomment and configure)
  # tls:
  # - hosts:
  #   - lexum.example.com
  #   secretName: lexum-tls
  rules:
  - host: lexum.example.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lexum
            port:
              number: 9200

