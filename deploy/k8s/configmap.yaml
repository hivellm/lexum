apiVersion: v1
kind: ConfigMap
metadata:
  name: lexum-config
  namespace: lexum
  labels:
    app: lexum-search-engine
data:
  # Cluster configuration
  cluster.name: "lexum-cluster"
  
  # Network configuration
  network.host: "0.0.0.0"
  network.http_port: "9200"
  
  # Storage paths
  path.data: "/data"
  path.logs: "/var/log/lexum"
  
  # Logging configuration
  logging.level: "info"
  logging.format: "json"
  
  # Snapshot configuration
  snapshots.path: "/snapshots"
  snapshots.max_snapshots: "100"
  snapshots.compression_enabled: "true"

