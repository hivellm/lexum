[package]
name = "lexum-integration-tests"
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.85"

[lib]
name = "integration_test"
path = "integration_test.rs"

[[bin]]
name = "snapshot_restore_workflow_tests"
path = "snapshot_restore_workflow_tests.rs"

[dependencies]
lexum-core = { path = "../lexum-core" }
lexum-server = { path = "../lexum-server" }
lexum-cli = { path = "../lexum-cli" }
lexum-stress-tests = { path = "stress" }
tokio = { version = "1.48", features = ["full"] }
serde_json = "1.0"
anyhow = "1.0"
tempfile = "3.8"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }