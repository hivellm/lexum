apiVersion: v1
kind: Service
metadata:
  name: lexum-loadbalancer
  namespace: lexum
  labels:
    app: lexum-search-engine
spec:
  type: LoadBalancer
  selector:
    app: lexum-search-engine
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP
  # Uncomment and configure for cloud providers
  # loadBalancerIP: "your-static-ip"
  # annotations:
  #   service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  #   service.beta.kubernetes.io/azure-load-balancer-resource-group: "your-resource-group"
  #   cloud.google.com/load-balancer-type: "Internal"

