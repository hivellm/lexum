[package]
name = "lexum-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core search engine library for Lexum"
readme = "README.md"
keywords = ["search", "full-text", "distributed", "tantivy"]
categories = ["database", "web-programming"]

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
bincode = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
once_cell = { workspace = true }
async-trait = { workspace = true }

# Search engine
tantivy = { workspace = true }

# Compression
flate2 = { workspace = true }
zstd = "0.13"
lz4 = "1.24"
blake3 = "1.5"

# Regular expressions for restore rename patterns and script matching
regex = "1.10"

# Hostname detection
hostname = "0.4"

# File watching for hot-reload
notify = "6.1"

# OpenAPI documentation
utoipa = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
tokio-test = "0.4"
tempfile = { workspace = true }

[[bench]]
name = "search_bench"
path = "benchmark/search_bench.rs"
harness = false

[[bench]]
name = "simple_bench"
path = "benchmark/simple_bench.rs"
harness = false

[features]
default = []
# Enable slow tests that may take longer or require special conditions
slow-tests = []
# Enable tests that require a running server (start-to-start)
s2s = []

[lints]
workspace = true