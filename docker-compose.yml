version: '3.8'

services:
  lexum:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0-alpha}
    image: lexum:${VERSION:-0.1.0-alpha}
    container_name: lexum-server
    ports:
      - "${HTTP_PORT:-9200}:9200"
    environment:
      - LEXUM_DATA_DIR=/data
      - LEXUM_NETWORK_HOST=0.0.0.0
      - LEXUM_NETWORK_HTTP_PORT=9200
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - lexum-data:/data
      - lexum-snapshots:/snapshots
      - ./config.example.yml:/app/config.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lexum-network

volumes:
  lexum-data:
    driver: local
  lexum-snapshots:
    driver: local

networks:
  lexum-network:
    driver: bridge

