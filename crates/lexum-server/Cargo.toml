[package]
name = "lexum-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "REST API server for Lexum search engine"
readme = "README.md"
keywords = ["search", "rest-api", "server", "axum"]
categories = ["web-programming::http-server"]

[dependencies]
# Workspace dependencies
lexum-core = { path = "../lexum-core" }

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
sys-info = "0.9"
num_cpus = "1.16"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
url = "2.5"

# OpenAPI generation
utoipa = { workspace = true }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }

# MCP (Model Context Protocol) support
rmcp = { version = "0.8", features = ["server", "macros", "transport-streamable-http-server"] }
hyper = { version = "1.7", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }

# UMICP protocol support
umicp-core = { version = "0.2.3", features = ["http2"] }
zstd = "0.13"
bincode = "1.3"
tokio-stream = "0.1"
futures = "0.3"

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }
# Load testing dependencies
reqwest = { version = "0.12", features = ["json"] }
tokio = { workspace = true, features = ["full"] }
futures = "0.3"
criterion = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
lexum-macros = { workspace = true }

[features]
default = []
s2s = []  # Enable server-to-server tests

[lints]
workspace = true

[[bin]]
name = "lexum-server"
path = "src/main.rs"

[[bin]]
name = "lexum-load-test"
path = "src/bin/load_test.rs"

[[bin]]
name = "lexum-http-load-test"
path = "src/bin/http_load_test.rs"

[[bin]]
name = "lexum-load-test-scale"
path = "src/bin/load_test_scale.rs"

[[bench]]
name = "network_performance_bench"
path = "benchmark/network_performance_bench.rs"
harness = false
